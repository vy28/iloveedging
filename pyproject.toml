[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iloveedging"
version = "0.1.0"
description = "Terminal-only Slips and Polymarket market intelligence"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
iloveedging = "iloveedging.__main__:main"

[project.urls]
Repository = "https://github.com/vy28/iloveedging"

[tool.setuptools.packages.find]
include = ["iloveedging*"]

[tool.setuptools.package-data]
iloveedging = ["*.tcss", "data/*.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
